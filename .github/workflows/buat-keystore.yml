name: Buat Keystore (sekali saja)

# Jalankan manual: tab Actions -> "Buat Keystore (sekali saja)" -> Run workflow.
# Hasilnya file keystore-base64.txt (di bagian Artifacts) untuk diisi ke
# Settings -> Secrets and variables -> Actions -> New repository secret: APK_KEYSTORE

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Buat keystore tetap
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SLRT Apps, O=PT Sulawesi Recycling Technology, C=ID"
          base64 -w 0 debug.keystore > keystore-base64.txt
          echo "Keystore dibuat. Unduh artifact 'apk-keystore'."

      - uses: actions/upload-artifact@v4
        with:
          name: apk-keystore
          path: |
            keystore-base64.txt
            debug.keystore
          retention-days: 1
