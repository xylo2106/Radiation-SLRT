name: slrt_apps
description: Aplikasi PT SLRT - Density SLRT, Radiation Log, Dokumen & Regulasi.
publish_to: 'none'
version: 1.16.1+33

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.png
    - assets/sources.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
